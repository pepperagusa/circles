<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#EFECE6">
  <title>Rosette</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --bg:    #EFECE6;
      --ink:   #1C1B1A;
      --muted: #6B6760;
      --line:  #D9D4CB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Geist', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    button { font-family: inherit; color: inherit; }

    .screen {
      max-width: 430px;
      height: 100svh;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 34px);
      display: flex;
      flex-direction: column;
    }
    .screen[hidden] { display: none; }

    .serif   { font-family: 'Instrument Serif', serif; font-weight: 400; }
    .mono    { font-family: 'Geist Mono', monospace; font-weight: 500; }
    .label   { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

    .icon-btn {
      width: 44px; height: 44px;
      border: none; border-radius: 22px;
      background: transparent;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .cta {
      height: 56px;
      border: none; border-radius: 28px;
      background: var(--ink); color: var(--bg);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-size: 17px; font-weight: 500;
      cursor: pointer;
    }

    /* Home */
    .home-hero {
      flex-grow: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px;
    }
    .home-hero h1 { margin-top: 12px; font-size: 72px; line-height: 1; letter-spacing: -0.01em; }
    .home-hero p  { font-size: 17px; color: var(--muted); }

    /* Game */
    header {
      height: 44px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .spacer { width: 44px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .stats > div {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 14px 0;
    }
    .stats > div + div { border-left: 1px solid var(--line); }
    .stats .value { font-size: 28px; line-height: 1; }
    .board-wrap {
      flex-grow: 1; min-height: 0;
      display: flex; align-items: center; justify-content: center;
    }
    canvas { display: block; touch-action: none; }
    .hint {
      margin-bottom: 16px;
      min-height: 1.4em;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }
    nav {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    nav button {
      height: 64px;
      border: none; border-radius: 16px;
      background: transparent;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    nav button:disabled { opacity: 0.35; cursor: default; }

    /* Solved */
    .solved-title {
      margin-top: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .solved-title h1 { font-size: 60px; line-height: 1; }
    .solved-title p  { font-size: 16px; color: var(--muted); }
    .solved-stats .value { font-size: 22px; }
  </style>
</head>
<body>
  <!-- Home -->
  <main id="home" class="screen">
    <div class="home-hero">
      <div id="logo"></div>
      <h1 class="serif">Rosette</h1>
      <p>A pocket cube, unfolded.</p>
    </div>
    <button id="play" class="cta">Play</button>
  </main>

  <!-- Game -->
  <main id="game" class="screen" hidden>
    <header>
      <button id="game-home" class="icon-btn" aria-label="Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <span class="serif" style="font-size: 24px; line-height: 1">Rosette</span>
      <span class="spacer"></span>
    </header>

    <div class="stats" style="margin-top: 28px">
      <div><span class="label">Moves</span><span id="moves" class="value mono">0</span></div>
      <div><span class="label">Time</span><span id="time" class="value mono">00:00</span></div>
    </div>

    <div id="board-wrap" class="board-wrap">
      <canvas id="c" aria-label="Puzzle board"></canvas>
    </div>

    <p id="hint" class="hint"></p>

    <nav>
      <button id="undo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>
        Undo
      </button>
      <button id="restart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
        Restart
      </button>
    </nav>
  </main>

  <!-- Solved -->
  <main id="solved" class="screen" hidden>
    <header>
      <button id="solved-home" class="icon-btn" aria-label="Close">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
      <span class="spacer"></span>
    </header>

    <div class="solved-title">
      <h1 class="serif">Solved<span style="font-style: italic">.</span></h1>
      <p>All six colours back together.</p>
    </div>

    <div id="solved-board" class="board-wrap"></div>

    <div class="stats solved-stats">
      <div><span id="solved-moves" class="value mono">0</span><span class="label">Moves</span></div>
      <div><span id="solved-time" class="value mono">0:00</span><span class="label">Time</span></div>
    </div>

    <button id="share" class="cta" style="margin-top: 24px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"></path><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg>
      <span id="share-label">Share result</span>
    </button>
  </main>

  <script>
  (() => {
    const $ = id => document.getElementById(id);

    // ── Geometry (logical units = the board's SVG viewBox) ──────────────────
    const VB      = { x: 100, y: 137, w: 1028, h: 990 };
    const SIDE    = 300;
    const triH    = SIDE * Math.sqrt(3) / 2;
    const RADII   = [267, 349];
    const HIT_TOL = 60;
    const DOT_R   = 22;
    const ANIM_MS = 180; // all dots in a step take this long, regardless of arc length

    const SCRAMBLE_MOVES = 12;
    const SCRAMBLE_MS    = 500;
    const SOLVED_DELAY   = 700;

    const GROUPS = [
      { x: 613,            y: 502          },
      { x: 613 - SIDE / 2, y: 502 + triH   },
      { x: 613 + SIDE / 2, y: 502 + triH   },
    ];

    // ── Circle intersections ──────────────────────────────────────────────────
    function circleIntersections(c1, r1, c2, r2) {
      const dx = c2.x - c1.x, dy = c2.y - c1.y;
      const d  = Math.hypot(dx, dy);
      if (d > r1 + r2 + 1e-9 || d < Math.abs(r1 - r2) - 1e-9) return [];
      const a  = (r1*r1 - r2*r2 + d*d) / (2*d);
      const h  = Math.sqrt(Math.max(0, r1*r1 - a*a));
      const mx = c1.x + a*dx/d, my = c1.y + a*dy/d;
      return [
        { x: mx + h*(dy/d), y: my - h*(dx/d) },
        { x: mx - h*(dy/d), y: my + h*(dx/d) },
      ];
    }

    // ── 24 fixed slots at all ring-pair intersections ─────────────────────────
    const slots     = []; // { x, y, colorIdx }
    const ringSlots = GROUPS.map(() => RADII.map(() => []));
    // ringSlots[gi][ri] = [ {si, angle} … ] — 8 entries sorted by angle

    for (const [pairIdx, [gi1, gi2]] of [[0,[0,1]],[1,[0,2]],[2,[1,2]]]) {
      for (let ri1 = 0; ri1 < 2; ri1++) {
        for (let ri2 = 0; ri2 < 2; ri2++) {
          const pts = circleIntersections(GROUPS[gi1], RADII[ri1], GROUPS[gi2], RADII[ri2]);
          for (let sideIdx = 0; sideIdx < pts.length; sideIdx++) {
            // sideIdx 0/1 = which side of the petal axis — consistent across all ring combos
            // so all 4 dots on the same side of a petal share one color
            const colorIdx = pairIdx * 2 + sideIdx;
            const pt = pts[sideIdx];
            const si = slots.length;
            const a1 = Math.atan2(pt.y - GROUPS[gi1].y, pt.x - GROUPS[gi1].x);
            const a2 = Math.atan2(pt.y - GROUPS[gi2].y, pt.x - GROUPS[gi2].x);
            slots.push({ x: pt.x, y: pt.y, colorIdx });
            ringSlots[gi1][ri1].push({ si, angle: a1 });
            ringSlots[gi2][ri2].push({ si, angle: a2 });
          }
        }
      }
    }
    for (let gi = 0; gi < 3; gi++)
      for (let ri = 0; ri < 2; ri++)
        ringSlots[gi][ri].sort((a, b) => a.angle - b.angle);

    // ── Dot colours (6 colors, 4 dots each) ──────────────────────────────────
    const INK      = '#1C1B1A';
    const COLORS   = ['#FFFFFF','#F4D348','#2350A0','#EB6A2C','#3F9B55','#B9323F'];
    const SOLVED   = slots.map(s => COLORS[s.colorIdx]);
    const CLUSTERS = COLORS.map((_, c) => slots.flatMap((s, si) => s.colorIdx === c ? [si] : []));

    let slotColors    = [...SOLVED];
    let displayColors = [...SOLVED]; // committed state + any in-flight shift

    function isSolved(colors = slotColors) {
      return CLUSTERS.every(cl => cl.every(si => colors[si] === colors[cl[0]]));
    }

    // ── Static SVG board (home logo, solved screen) ──────────────────────────
    function boardSVG(colors, { width, ring, dotR, dotStroke, label }) {
      const height = Math.round(width * VB.h / VB.w);
      const rings = GROUPS.flatMap(g => RADII.map(r =>
        `<circle cx="${g.x}" cy="${g.y}" r="${r}"></circle>`)).join('');
      const dots = slots.map((s, si) =>
        `<circle cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" r="${dotR}" fill="${colors[si]}"></circle>`).join('');
      return `<svg width="${width}" height="${height}" viewBox="${VB.x} ${VB.y} ${VB.w} ${VB.h}" role="img" aria-label="${label}">` +
        `<g fill="none" stroke="${INK}" stroke-width="${ring}">${rings}</g>` +
        `<g stroke="${INK}" stroke-width="${dotStroke}">${dots}</g></svg>`;
    }

    $('logo').innerHTML = boardSVG(SOLVED, { width: 260, ring: 9, dotR: 24, dotStroke: 5, label: 'Rosette logo' });

    // ── Angle helpers ─────────────────────────────────────────────────────────
    function normDelta(a) {
      while (a >  Math.PI) a -= 2 * Math.PI;
      while (a < -Math.PI) a += 2 * Math.PI;
      return a;
    }

    function nearestOnRing(gi, ri, angle) {
      const rs = ringSlots[gi][ri];
      let best = 0, bd = Infinity;
      for (let i = 0; i < rs.length; i++) {
        const d = Math.abs(normDelta(angle - rs[i].angle));
        if (d < bd) { bd = d; best = i; }
      }
      return best;
    }

    function computeShift(gi, ri, delta) {
      const rs = ringSlots[gi][ri], n = rs.length;
      const votes = new Array(n).fill(0);
      for (let i = 0; i < n; i++) {
        const j = nearestOnRing(gi, ri, rs[i].angle + delta);
        votes[(j - i + n) % n]++;
      }
      const rawShift = votes.indexOf(Math.max(...votes));
      // Snap in pairs: round to nearest multiple of 2, symmetrically around 0
      const signed   = rawShift > n / 2 ? rawShift - n : rawShift;
      const rounded  = Math.sign(signed) * Math.round(Math.abs(signed) / 2) * 2;
      return ((rounded % n) + n) % n;
    }

    function applyShift(gi, ri, shift, src) {
      const rs  = ringSlots[gi][ri], n = rs.length;
      const out = [...src];
      const col = rs.map(e => src[e.si]);
      for (let i = 0; i < n; i++) out[rs[(i + shift) % n].si] = col[i];
      return out;
    }

    // ── Canvas sizing ─────────────────────────────────────────────────────────
    const canvas = $('c');
    const ctx    = canvas.getContext('2d');
    const wrap   = $('board-wrap');

    function resize() {
      const w = wrap.clientWidth, h = wrap.clientHeight;
      if (!w || !h) return;
      const dpr   = window.devicePixelRatio || 1;
      const cssW  = Math.min(w, h * VB.w / VB.h, 520);
      const cssH  = cssW * VB.h / VB.w;
      canvas.style.width  = cssW + 'px';
      canvas.style.height = cssH + 'px';
      canvas.width  = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      scheduleRedraw();
    }
    new ResizeObserver(resize).observe(wrap);

    // ── Hit testing ───────────────────────────────────────────────────────────
    function toLogical(e) {
      const rect = canvas.getBoundingClientRect();
      const s    = e.touches ? e.touches[0] : e;
      return { x: VB.x + (s.clientX - rect.left) * VB.w / rect.width,
               y: VB.y + (s.clientY - rect.top)  * VB.h / rect.height };
    }

    function angleTo(g, pos) { return Math.atan2(pos.y - g.y, pos.x - g.x); }

    // Nearest ring of each group within HIT_TOL — up to 3 candidates at intersections
    function ringCandidates(pos) {
      const out = [];
      for (let gi = 0; gi < GROUPS.length; gi++) {
        const g = GROUPS[gi], dist = Math.hypot(pos.x - g.x, pos.y - g.y);
        let best = null, bd = HIT_TOL;
        for (let ri = 0; ri < RADII.length; ri++) {
          const d = Math.abs(dist - RADII[ri]);
          if (d < bd) { bd = d; best = { gi, ri, d }; }
        }
        if (best) out.push(best);
      }
      return out.sort((a, b) => a.d - b.d);
    }

    // ── Animation ─────────────────────────────────────────────────────────────
    // When a ring's dots shift by one step, each dot animates along its arc.
    // All 8 dots take the same wall-clock time (ANIM_MS) so faster dots =
    // longer arcs = higher angular speed.
    let anim = null;
    // anim = { gi, ri, slotIndices: Set<si>, dots: [{fromAngle, delta, color}],
    //          startTime, duration }

    function startAnimation(gi, ri, rawShiftDiff) {
      const rs = ringSlots[gi][ri], n = rs.length;
      // Normalise to unsigned [0, n) and pick the signed direction
      const sd     = ((rawShiftDiff % n) + n) % n;
      const signed = sd > n / 2 ? sd - n : sd; // shortest-path sign

      // Capture dot colours BEFORE displayColors is updated to the new shift
      const anim_dots = rs.map((entry, i) => {
        const fromAngle = entry.angle;
        const toAngle   = rs[(i + sd) % n].angle;
        let delta = toAngle - fromAngle;
        // Force delta to point in the same direction as signed
        if (signed > 0 && delta < -1e-9) delta += 2 * Math.PI;
        if (signed < 0 && delta >  1e-9) delta -= 2 * Math.PI;
        return { fromAngle, delta, color: displayColors[entry.si] };
      });

      anim = {
        gi, ri,
        slotIndices: new Set(rs.map(e => e.si)),
        dots:        anim_dots,
        startTime:   performance.now(),
        duration:    ANIM_MS,
      };
    }

    function easeInOut(t) { return t * t * (3 - 2 * t); }

    // Turn a ring by `shift` slots outside of a drag (scramble, undo)
    function turn(gi, ri, shift) {
      const n = ringSlots[gi][ri].length;
      shift = ((shift % n) + n) % n;
      startAnimation(gi, ri, shift);
      slotColors    = applyShift(gi, ri, shift, slotColors);
      displayColors = [...slotColors];
      scheduleRedraw();
    }

    // ── Render loop ───────────────────────────────────────────────────────────
    let rafId = null;

    function scheduleRedraw() {
      if (rafId === null) rafId = requestAnimationFrame(frame);
    }

    function frame(now) {
      rafId = null;
      draw(now);
      if (anim && now < anim.startTime + anim.duration) scheduleRedraw();
    }

    function drawDot(x, y, color) {
      ctx.beginPath();
      ctx.arc(x, y, DOT_R, 0, Math.PI * 2);
      ctx.fillStyle   = color;
      ctx.fill();
      ctx.strokeStyle = INK;
      ctx.lineWidth   = 4;
      ctx.stroke();
    }

    function draw(now = performance.now()) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const s = canvas.width / VB.w;
      ctx.setTransform(s, 0, 0, s, -VB.x * s, -VB.y * s);

      // Rings
      for (let gi = 0; gi < GROUPS.length; gi++) {
        const g = GROUPS[gi];
        for (let ri = 0; ri < RADII.length; ri++) {
          ctx.beginPath();
          ctx.arc(g.x, g.y, RADII[ri], 0, Math.PI * 2);
          ctx.strokeStyle = INK;
          ctx.lineWidth   = 7;
          ctx.stroke();
        }
      }

      // Skip static draw for any slot whose dot is currently mid-animation
      const animSlots = anim?.slotIndices ?? new Set();

      // Static dots (at their fixed world positions)
      for (let si = 0; si < slots.length; si++) {
        if (animSlots.has(si)) continue;
        drawDot(slots[si].x, slots[si].y, displayColors[si]);
      }

      // Animated dots (arc-interpolated along their ring)
      if (anim) {
        const elapsed = now - anim.startTime;
        const t = easeInOut(Math.min(1, elapsed / anim.duration));
        const g = GROUPS[anim.gi];
        const r = RADII[anim.ri];

        for (const dot of anim.dots) {
          const angle = dot.fromAngle + t * dot.delta;
          drawDot(g.x + r * Math.cos(angle), g.y + r * Math.sin(angle), dot.color);
        }

        if (elapsed >= anim.duration) anim = null;
      }
    }

    // ── Game state ────────────────────────────────────────────────────────────
    let phase         = 'idle'; // 'scrambling' | 'play' | 'solved'
    let startColors   = null;   // position right after the scramble (for Restart)
    let history       = [];     // [{gi, ri, shift}]
    let scrambleTimer = null;

    let timerStart = null, elapsedMs = 0, timerId = null;

    function fmtTime(ms) {
      const t = Math.floor(ms / 1000);
      return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
    }
    function currentMs() {
      return timerStart === null ? elapsedMs : performance.now() - timerStart;
    }
    function startTimer() {
      timerStart = performance.now();
      timerId    = setInterval(updateUI, 250);
    }
    function stopTimer() {
      if (timerStart !== null) elapsedMs = performance.now() - timerStart;
      timerStart = null;
      clearInterval(timerId);
    }
    function resetTimer() {
      stopTimer();
      elapsedMs = 0;
    }

    function updateUI() {
      $('moves').textContent = history.length;
      $('time').textContent  = fmtTime(currentMs());
      $('undo').disabled     = phase !== 'play' || history.length === 0;
      $('restart').disabled  = phase !== 'play' || history.length === 0;
    }

    function setHint(text) { $('hint').textContent = text; }

    function showScreen(id) {
      for (const s of ['home', 'game', 'solved']) $(s).hidden = s !== id;
    }

    function newGame() {
      clearTimeout(scrambleTimer);
      anim          = null;
      slotColors    = [...SOLVED];
      displayColors = [...SOLVED];
      history       = [];
      resetTimer();
      showScreen('game');
      resize();
      scramble();
    }

    // Show the solved board, then make SCRAMBLE_MOVES random ring turns,
    // one every SCRAMBLE_MS, so the player can watch it get mixed up.
    function scramble() {
      phase = 'scrambling';
      updateUI();
      setHint('Watch closely…');
      let count = 0, last = -1;

      const step = () => {
        let r;
        do { r = Math.floor(Math.random() * 6); } while (r === last); // never the same ring twice in a row
        last = r;
        const gi = Math.floor(r / 2), ri = r % 2;
        turn(gi, ri, Math.random() < 0.5 ? 2 : -2);
        count++;
        setHint(`Scrambling… ${Math.min(count, SCRAMBLE_MOVES)} / ${SCRAMBLE_MOVES}`);

        if (count < SCRAMBLE_MOVES || isSolved()) {
          scrambleTimer = setTimeout(step, SCRAMBLE_MS);
        } else {
          scrambleTimer = setTimeout(() => {
            phase        = 'play';
            startColors  = [...slotColors];
            setHint('Drag along any ring to turn it.');
            updateUI();
            scheduleRedraw();
          }, ANIM_MS);
        }
      };
      scrambleTimer = setTimeout(step, SCRAMBLE_MS);
    }

    function recordMove(gi, ri, shift) {
      if (timerStart === null) startTimer(); // clock starts on the first move
      history.push({ gi, ri, shift });
      updateUI();
      if (isSolved()) finish();
    }

    function finish() {
      phase = 'solved';
      stopTimer();
      updateUI();
      setHint('');
      setTimeout(showSolved, ANIM_MS + SOLVED_DELAY);
    }

    function showSolved() {
      $('solved-board').innerHTML = boardSVG(slotColors, { width: 300, ring: 7, dotR: 22, dotStroke: 4, label: 'Puzzle board, solved' });
      $('solved-moves').textContent = history.length;
      $('solved-time').textContent  = fmtTime(elapsedMs).replace(/^0/, '');
      $('share-label').textContent  = 'Share result';
      showScreen('solved');
    }

    function undo() {
      if (phase !== 'play' || !history.length) return;
      const m = history.pop();
      turn(m.gi, m.ri, -m.shift);
      updateUI();
    }

    function restart() {
      if (phase !== 'play' || !history.length) return;
      anim          = null;
      slotColors    = [...startColors];
      displayColors = [...startColors];
      history       = [];
      resetTimer();
      updateUI();
      scheduleRedraw();
    }

    function goHome() {
      clearTimeout(scrambleTimer);
      stopTimer();
      phase = 'idle';
      drag  = null;
      showScreen('home');
    }

    async function share() {
      const text = `I solved Rosette in ${history.length} moves (${fmtTime(elapsedMs)}).`;
      try {
        if (navigator.share) {
          await navigator.share({ text, url: location.href });
        } else {
          await navigator.clipboard.writeText(`${text} ${location.href}`);
          $('share-label').textContent = 'Copied to clipboard';
        }
      } catch (_) { /* share sheet dismissed */ }
    }

    // ── Interaction ───────────────────────────────────────────────────────────
    let drag = null;
    // { gi, ri, candidates, startPos, lastAngle, totalDelta, startColors, lastShift, hasMoved }

    function onStart(e) {
      if (phase !== 'play') return;
      e.preventDefault();
      const pos = toLogical(e);
      // Every ring within HIT_TOL — may be >1 at intersection dots
      const candidates = ringCandidates(pos);
      if (!candidates.length) return;
      anim = null;
      if (candidates.length === 1) {
        const { gi, ri } = candidates[0];
        drag = { gi, ri, candidates: null,
                 startPos: pos, lastAngle: angleTo(GROUPS[gi], pos),
                 totalDelta: 0, startColors: [...slotColors], lastShift: 0, hasMoved: false };
      } else {
        // Ambiguous — defer ring selection until drag direction is clear
        drag = { gi: null, ri: null, candidates,
                 startPos: pos, lastAngle: null,
                 totalDelta: 0, startColors: [...slotColors], lastShift: 0, hasMoved: false };
      }
      canvas.style.cursor = 'grabbing';
      scheduleRedraw();
    }

    function onMove(e) {
      if (phase !== 'play') return;
      e.preventDefault();
      const pos = toLogical(e);
      if (!drag) {
        canvas.style.cursor = ringCandidates(pos).length ? 'grab' : 'default';
        return;
      }

      // Resolve ambiguous ring using initial drag direction
      if (drag.gi === null) {
        const dx = pos.x - drag.startPos.x, dy = pos.y - drag.startPos.y;
        if (Math.hypot(dx, dy) < 8) { scheduleRedraw(); return; } // wait for clearer intent
        const dragAngle = Math.atan2(dy, dx);
        let best = drag.candidates[0], bestScore = -Infinity;
        for (const c of drag.candidates) {
          // Score = tangential alignment: |sin(dragAngle - radialAngle)|
          const radial = Math.atan2(drag.startPos.y - GROUPS[c.gi].y,
                                    drag.startPos.x - GROUPS[c.gi].x);
          const score = Math.abs(Math.sin(dragAngle - radial));
          if (score > bestScore) { bestScore = score; best = c; }
        }
        drag.gi        = best.gi;
        drag.ri        = best.ri;
        drag.lastAngle = angleTo(GROUPS[drag.gi], drag.startPos);
      }

      const newAngle   = angleTo(GROUPS[drag.gi], pos);
      drag.totalDelta += normDelta(newAngle - drag.lastAngle);
      drag.lastAngle   = newAngle;

      // Only one move per grab — lock after the first pair snaps
      if (!drag.hasMoved) {
        const newShift = computeShift(drag.gi, drag.ri, drag.totalDelta);
        if (newShift !== drag.lastShift) {
          startAnimation(drag.gi, drag.ri, newShift - drag.lastShift);
          drag.lastShift = newShift;
          displayColors  = applyShift(drag.gi, drag.ri, newShift, drag.startColors);
          drag.hasMoved  = true;
        }
      }
      scheduleRedraw();
    }

    function onEnd() {
      if (!drag) return;
      const { gi, ri, hasMoved, lastShift } = drag;
      drag                = null;
      canvas.style.cursor = 'default';
      slotColors          = [...displayColors];
      if (hasMoved) recordMove(gi, ri, lastShift);
      scheduleRedraw();
    }

    canvas.addEventListener('mousedown',   onStart);
    canvas.addEventListener('mousemove',   onMove);
    window.addEventListener('mouseup',     onEnd);
    canvas.addEventListener('touchstart',  onStart, { passive: false });
    canvas.addEventListener('touchmove',   onMove,  { passive: false });
    canvas.addEventListener('touchend',    onEnd);
    canvas.addEventListener('touchcancel', onEnd);

    $('play').addEventListener('click',        newGame);
    $('game-home').addEventListener('click',   goHome);
    $('solved-home').addEventListener('click', goHome);
    $('undo').addEventListener('click',        undo);
    $('restart').addEventListener('click',     restart);
    $('share').addEventListener('click',       share);
  })();
  </script>
</body>
</html>
